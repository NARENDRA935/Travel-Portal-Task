<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    body{
  margin:0;
  padding:0;
  font-family: Arial;
  background:#f0f2f5;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.login-container{
  background:white;
  padding:40px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  width:300px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
}

button{
  width:100%;
  padding:10px;
  background:#007bff;
  color:white;
  border:none;
}
button:hover{
  background:#0056b3;
  cursor:pointer;
  transform:scale(1.05);
  transition:0.3s;
}
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Travel Portal Login</h2>

    <form>
      <input type="text" placeholder="Username">
      <input type="password" placeholder="Password">
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
